name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: skillbridge_ci
          POSTGRES_PASSWORD: skillbridge_ci_password
          POSTGRES_DB: skillbridge_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge_ci -d skillbridge_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: flask db upgrade
        working-directory: backend
        env:
          FLASK_APP: run.py
          DATABASE_URL: postgresql+psycopg://skillbridge_ci:skillbridge_ci_password@localhost:5432/skillbridge_ci_test
          JWT_SECRET_KEY: ci-only-secret-value-at-least-32-bytes
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://skillbridge_ci:skillbridge_ci_password@localhost:5432/skillbridge_ci_test
          JWT_SECRET_KEY: ci-only-secret-value-at-least-32-bytes
          TEST_REDIS_URL: redis://localhost:6379/15
          RATELIMIT_STORAGE_URI: redis://localhost:6379/14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
